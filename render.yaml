services:
  - type: web
    name: price-ai-bot
    runtime: docker
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: DATABASE_PATH
        value: /app/data/pricebot.db
    disk:
      name: pricebot-data
      mountPath: /app/data
      sizeGB: 1
