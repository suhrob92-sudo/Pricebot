services:
  - type: web
    name: price-ai-bot
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m bot.main
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: DATABASE_PATH
        value: data/pricebot.db
